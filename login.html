<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
<!-- login page -->


<div class="bg-white  dark:bg-gray-950 rounded-xl shadow-xl px-8">


<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <h1 class="text-center text-5xl font-bold text-violet-500 mb-8">WELCOME BACK</h1>
  <h3 class="text-center text-violet-400 font-bold">sign in to your account</h3>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md bg-white dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl shadow-xl p-8">
    <form action="#" method="POST" class="space-y-6">
      <div>
        <label for="email" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Email address</label>
        <div class="mt-4">
          <input id="email" type="email" name="email" required autocomplete="email" class="block w-full rounded-xl bg-violet-300 dark:bg-violet-950 px-3 py-1.5 text-base text-gray-900 dark:text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Password</label>
          <div class="text-sm">
            <a href="#" class="font-semibold text-indigo-400 dark:text-indigo-300 hover:text-indigo-300">Forgot password?</a>
          </div>
        </div>
        <div class="mt-4">
          <input id="password" type="password" name="password" required autocomplete="current-password" class="block w-full rounded-xl bg-violet-300 dark:bg-violet-950 px-3 py-1.5 text-base text-gray-900 dark:text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
        </div>
      </div>

      <div class="mt-8">
        <button type="submit" class="flex w-full justify-center rounded-xl bg-violet-600 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-violet-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-500">login</button>
      </div>
      <p class="text-center mt-7 text-sm text-violet-600 dark:text-violet-300">don't have an account?
      <a href="register.html" class="text-center text-violet-600 dark:text-violet-400 hover:underline">Register</a>
     </p>
    </form>
  </div>
</div>
</div>


</body>
</html>
